import os, requests, random, json, sys, glob
from datetime import datetime
import numpy as np
import moviepy.editor as mp
from moviepy.video.fx.all import loop 
from PIL import Image, ImageFont, ImageDraw
from arabic_reshaper import reshape
from bidi.algorithm import get_display

# ================== الإعدادات والمفاتيح ==================
WIDTH = 1080
HEIGHT = 1920
PEXELS_API_KEY = os.getenv('PEXELS_API_KEY')
FB_PAGE_ID = os.getenv('FB_PAGE_ID')
FB_ACCESS_TOKEN = os.getenv('FB_ACCESS_TOKEN')

# الروابط والخطوط
FONT_PATH_AR = "ArabicFont.ttf" 
RECITERS = ['ar.alafasy', 'ar.husary', 'ar.minshawi']

def get_random_quran_ayah():
    try:
        edition = random.choice(RECITERS)
        ayah_num = random.randint(1, 6236)
        url = f"https://api.alquran.cloud/v1/ayah/{ayah_num}/{edition}"
        res = requests.get(url).json()
        if res['code'] == 200:
            data = res['data']
            return {
                'text': data['text'],
                'audio': data['audio'],
                'surah': data['surah']['name'],
                'num': data['numberInSurah']
            }
    except:
        return None

def download_bg_video():
    headers = {"Authorization": PEXELS_API_KEY}
    q = random.choice(["nature", "clouds", "sea", "stars"])
    url = f"https://api.pexels.com/videos/search?query={q}&per_page=10&orientation=portrait"
    res = requests.get(url, headers=headers).json()
    video_url = random.choice(res['videos'])['video_files'][0]['link']
    with open("bg.mp4", "wb") as f:
        f.write(requests.get(video_url).content)
    return "bg.mp4"

def process_arabic_text(text):
    reshaped = reshape(text)
    return get_display(reshaped)

def create_video(data, bg_path):
    # تحميل الصوت
    with open("audio.mp3", "wb") as f:
        f.write(requests.get(data['audio']).content)
    
    audio_clip = mp.AudioFileClip("audio.mp3")
    video_clip = mp.VideoFileClip(bg_path).resize(height=HEIGHT)
    
    # ضبط مدة الفيديو لتناسب الصوت
    if video_clip.duration < audio_clip.duration:
        video_clip = loop(video_clip, duration=audio_clip.duration)
    else:
        video_clip = video_clip.subclip(0, audio_clip.duration)
    
    video_clip = video_clip.set_audio(audio_clip)

    # إضافة النص العربي (الآية)
    clean_text = process_arabic_text(data['text'])
    txt_clip = mp.TextClip(clean_text, fontsize=70, color='white', font=FONT_PATH_AR, 
                           method='caption', size=(WIDTH*0.8, None)).set_duration(audio_clip.duration).set_position('center')

    # إضافة اسم السورة
    surah_text = process_arabic_text(f"سورة {data['surah']}")
    surah_clip = mp.TextClip(surah_text, fontsize=50, color='yellow', font=FONT_PATH_AR).set_duration(audio_clip.duration).set_position(('center', HEIGHT-300))

    final = mp.CompositeVideoClip([video_clip, txt_clip, surah_clip])
    final.write_videofile("final.mp4", fps=24, codec="libx264", audio_codec="aac")
    return "final.mp4"

def upload_to_facebook(path, caption):
    print("🚀 جاري الرفع لفيسبوك...")
    url = f"https://graph.facebook.com/v19.0/{FB_PAGE_ID}/videos"
    files = {'source': open(path, 'rb')}
    payload = {
        'description': caption,
        'access_token': FB_ACCESS_TOKEN
    }
    r = requests.post(url, data=payload, files=files)
    if r.status_code == 200:
        print("✅ تم النشر بنجاح!")
    else:
        print(f"❌ خطأ: {r.text}")

if __name__ == "__main__":
    ayah_data = get_random_quran_ayah()
    if ayah_data:
        bg = download_bg_video()
        video = create_video(ayah_data, bg)
        cap = f"تلاوة خاشعة من سورة {ayah_data['surah']} ✨\n#قرآن #Reels #Islam"
        upload_to_facebook(video, cap)
        
