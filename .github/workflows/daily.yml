name: Facebook Daily Post

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager groq

      - name: Run Script
        env:
          # التأكد من ربط كل الأسرار هنا
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python main.py
